<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Sayfa bulunamadı</title>
    <script>
      if (["umitcagdas.github.io", "umitcagdas.com", "www.umitcagdas.com"].includes(location.hostname) &&
          /^\/remotiq(?:\/|$)/i.test(location.pathname)) {
        const target = new URL("https://remotiq.umitcagdas.com/");
        target.pathname = location.pathname.slice("/remotiq".length) || "/";
        target.search = location.search;
        target.hash = location.hash;
        location.replace(target.href);
      }
    </script>
  </head>
  <body>
    <h1>Sayfa bulunamadı</h1>
    <p><a href="/">Ana sayfaya dön</a></p>
  </body>
</html>
